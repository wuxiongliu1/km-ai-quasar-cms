version: '3.8'

services:
  # ==========================================
  # CMS 前端应用 (SPA 模式)
  # ==========================================
  cms-spa:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-spa
    container_name: cms-spa
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - cms-network

  # ==========================================
  # CMS 前端应用 (SSR 模式)
  # ==========================================
  cms-ssr:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-ssr
    container_name: cms-ssr
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - cms-network

  # ==========================================
  # Nginx 反向代理 (可选)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms-ssr
    restart: unless-stopped
    networks:
      - cms-network
    profiles:
      - proxy

networks:
  cms-network:
    driver: bridge
